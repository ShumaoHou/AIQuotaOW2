plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.aibalance'
    compileSdk 33

    defaultConfig {
        applicationId 'com.example.aibalance'
        // OPPO Watch 2 (国内版 ColorOS Watch) 基于 Android 8.1 (API 27)
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
