plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.aibalance'
    compileSdk 33

    defaultConfig {
        applicationId 'com.example.aibalance'
        // OPPO Watch 2 (国内版 ColorOS Watch) 基于 Android 8.1 (API 27)
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // 从本地 keystore.properties 读取签名信息（该文件不提交进仓库）
    signingConfigs {
        release {
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    // 产物按「项目名-版本号-构建类型」命名，例如 AIQuotaOW2-v1.0-release.apk
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "${rootProject.name}-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}
